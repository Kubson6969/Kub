name: MMOClases
version: '${project.version}'
main: com.kubson.mmoclases.MMOClases
api-version: '1.21'
author: Kubson
description: Clases RPG (Mago, Arquero, Guerrero, Clérigo) con stats, habilidades y soporte para MMOWeaponary.
softdepend: [MMOWeaponary]

commands:
  clase:
    description: Menú y gestión de tu clase.
    usage: /<command> [menu|elegir|info|stats|asignar|habilidades|lanzar|modo|admin]
    aliases: [clases, class]

permissions:
  mmoclases.use:
    description: Permite elegir clase y usar habilidades.
    default: true
  mmoclases.cambiar:
    description: Permite cambiar de clase una vez elegida.
    default: true
  mmoclases.admin:
    description: Comandos de administración de MMOClases.
    default: op
