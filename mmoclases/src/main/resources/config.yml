# ==============================================================
#  MMOClases - configuración
#  Todos los números de balance se pueden cambiar aquí sin recompilar.
#  Usa /clase admin recargar después de editar.
# ==============================================================

general:
  # Mantiene 10 corazones en pantalla aunque la vida real sea mayor.
  escalar-corazones: true
  # Si es false, las habilidades nunca dañan a otros jugadores.
  pvp-habilidades: false
  # Si es false, las áreas de efecto no dañan animales pasivos ni aldeanos.
  habilidades-danan-animales: false
  # Reducción de daño = defensa / (defensa + constante).
  defensa-constante: 60
  # Tope de la stat reduccion_enfriamiento (en %).
  reduccion-enfriamiento-maxima: 40
  # Multiplicador de daño al golpear con un arma que no es de tu clase.
  multiplicador-arma-incorrecta: 0.5
  autoguardado-minutos: 5
  mostrar-hud: true

modo-habilidades:
  # F (cambiar de mano) con el arma de tu clase activa el modo habilidades.
  # Dentro del modo, las teclas 1-4 lanzan las habilidades 1-4.
  # Si es true, hay que agacharse + F (así F sigue sirviendo para el escudo).
  requiere-agacharse: false
  # Si es true, solo se pueden lanzar habilidades con un arma de tu clase en la mano.
  requiere-arma-de-clase: true

experiencia:
  nivel-maximo: 50
  # XP para pasar del nivel N al N+1 = base * N ^ exponente
  base: 50
  exponente: 1.3
  puntos-por-nivel: 3
  multiplicador: 1.0
  # XP para cualquier monstruo hostil que no esté en la lista de abajo.
  # Los animales y aldeanos no dan XP salvo que los añadas a la lista.
  por-defecto: 5
  mobs:
    ZOMBIE: 10
    HUSK: 12
    DROWNED: 12
    ZOMBIE_VILLAGER: 10
    SKELETON: 12
    STRAY: 14
    BOGGED: 14
    SPIDER: 10
    CAVE_SPIDER: 12
    CREEPER: 14
    SLIME: 4
    MAGMA_CUBE: 6
    PHANTOM: 15
    ENDERMAN: 25
    WITCH: 30
    BLAZE: 25
    GHAST: 40
    WITHER_SKELETON: 35
    PIGLIN_BRUTE: 40
    HOGLIN: 30
    ZOGLIN: 35
    GUARDIAN: 30
    ELDER_GUARDIAN: 400
    PILLAGER: 20
    VINDICATOR: 35
    EVOKER: 60
    RAVAGER: 120
    BREEZE: 50
    WARDEN: 1000
    WITHER: 1500
    ENDER_DRAGON: 3000

recursos:
  furia:
    por-golpe: 8
    por-dano-recibido: 4
    # Furia que se pierde por segundo tras estar fuera de combate.
    decaimiento: 3
    segundos-fuera-combate: 5

# Lo que da cada punto de atributo (stat: cantidad por punto).
atributos:
  fuerza:
    dano_fisico: 1.5
  destreza:
    dano_distancia: 1.5
    critico_prob: 0.2
  inteligencia:
    poder_magico: 1.5
    recurso_maximo: 2
  vitalidad:
    vida_maxima: 1.0
    defensa: 1.0
  espiritu:
    poder_curacion: 1.5
    regen_recurso: 0.1

# Stats disponibles:
#   vida_maxima (extra sobre los 20 de vanilla), recurso_maximo, regen_recurso (por segundo),
#   dano_fisico (%), dano_distancia (%), poder_magico (%), poder_curacion (%),
#   critico_prob (%), critico_dano (%), defensa, robo_vida (%), reduccion_enfriamiento (%)
clases:
  mago:
    armas: [BACULO, VARITA]
    base:
      vida_maxima: 4
      recurso_maximo: 100
      regen_recurso: 4
      poder_magico: 10
      critico_prob: 5
      critico_dano: 150
      defensa: 2
    por-nivel:
      vida_maxima: 0.5
      recurso_maximo: 2
      regen_recurso: 0.05
      poder_magico: 1.5
  arquero:
    armas: [ARCO, BALLESTA]
    base:
      vida_maxima: 6
      recurso_maximo: 100
      regen_recurso: 10
      dano_distancia: 10
      critico_prob: 10
      critico_dano: 160
      defensa: 4
    por-nivel:
      vida_maxima: 0.6
      dano_distancia: 1.5
      critico_prob: 0.2
  guerrero:
    armas: [ESPADA, HACHA, MAZA]
    base:
      vida_maxima: 16
      recurso_maximo: 100
      dano_fisico: 10
      critico_prob: 5
      critico_dano: 150
      defensa: 12
      robo_vida: 2
    por-nivel:
      vida_maxima: 1.0
      dano_fisico: 1.2
      defensa: 0.6
  clerigo:
    armas: [CETRO, TOMO]
    base:
      vida_maxima: 10
      recurso_maximo: 120
      regen_recurso: 5
      poder_magico: 5
      poder_curacion: 10
      critico_prob: 5
      critico_dano: 150
      defensa: 6
    por-nivel:
      vida_maxima: 0.8
      recurso_maximo: 2
      regen_recurso: 0.05
      poder_magico: 1.0
      poder_curacion: 1.5

# Pasivas de cada clase.
pasivas:
  mago:
    # Sobrecarga Arcana: cada N hechizos, uno no cuesta maná.
    cada-n-hechizos: 4
  arquero:
    # Ojo de Halcón: % de daño extra por bloque de distancia al objetivo.
    bono-por-bloque: 1.5
    bono-maximo: 45
  guerrero:
    # Voluntad de Hierro: por debajo de este % de vida recibes menos daño.
    umbral-vida: 35
    reduccion: 25
  clerigo:
    # Luz Purificadora: % de daño extra contra no-muertos.
    bono-no-muertos: 50

# Parámetros de cada habilidad.
#   nivel = nivel de clase para desbloquearla
#   coste = recurso que consume, enfriamiento = segundos
#   dano-base / curacion-base se multiplican por (1 + stat% / 100)
habilidades:
  # ---------------- MAGO ----------------
  bola_fuego:
    nivel: 1
    coste: 20
    enfriamiento: 4
    dano-base: 8
    radio: 3
    alcance: 30
    fuego-segundos: 3
  parpadeo:
    nivel: 5
    coste: 25
    enfriamiento: 10
    distancia: 8
  nova_escarcha:
    nivel: 10
    coste: 35
    enfriamiento: 12
    dano-base: 6
    radio: 5
    lentitud-segundos: 3
    lentitud-nivel: 3
  meteoro:
    nivel: 20
    coste: 60
    enfriamiento: 45
    dano-base: 20
    radio: 5
    alcance: 30
    retraso-ticks: 30
    fuego-segundos: 5
  # ---------------- ARQUERO ----------------
  disparo_triple:
    nivel: 1
    coste: 25
    enfriamiento: 3
    dano-base: 5
    flechas: 3
    apertura: 12
    velocidad: 3.0
  salto_evasivo:
    nivel: 5
    coste: 30
    enfriamiento: 8
    fuerza: 1.6
    altura: 0.6
    velocidad-segundos: 3
    velocidad-nivel: 2
  flecha_explosiva:
    nivel: 10
    coste: 40
    enfriamiento: 10
    dano-base: 10
    radio: 4
    velocidad: 3.0
  lluvia_flechas:
    nivel: 20
    coste: 60
    enfriamiento: 40
    dano-base: 4
    radio: 4
    alcance: 30
    duracion-segundos: 3
    flechas-por-oleada: 4
  # ---------------- GUERRERO ----------------
  tajo_giratorio:
    nivel: 1
    coste: 20
    enfriamiento: 5
    dano-base: 8
    radio: 3.5
    empuje: 0.8
  carga:
    nivel: 5
    coste: 15
    enfriamiento: 10
    dano-base: 6
    fuerza: 1.8
    aturdir-segundos: 1.5
  grito_guerra:
    nivel: 10
    coste: 25
    enfriamiento: 20
    radio: 10
    duracion-segundos: 6
    absorcion-nivel: 2
  golpe_titan:
    nivel: 20
    coste: 50
    enfriamiento: 35
    dano-base: 18
    radio: 6
    salto: 1.1
  # ---------------- CLÉRIGO ----------------
  luz_sagrada:
    nivel: 1
    coste: 15
    enfriamiento: 3
    dano-base: 7
    curacion-base: 5
    alcance: 20
  circulo_sanacion:
    nivel: 5
    coste: 35
    enfriamiento: 15
    curacion-base: 2.5
    radio: 5
    duracion-segundos: 5
  escudo_divino:
    nivel: 10
    coste: 30
    enfriamiento: 18
    radio: 8
    duracion-segundos: 10
  juicio_celestial:
    nivel: 20
    coste: 70
    enfriamiento: 50
    dano-base: 16
