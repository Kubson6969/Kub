    objetivos: 6

# ==============================================================
#  Integración con MMOWeaponary
#  Orden de detección de armas:
#   1) Un WeaponProvider registrado por MMOWeaponary (ver README).
#   2) Datos guardados en el PersistentDataContainer del item.
#   3) Materiales vanilla (útil para pruebas).
# ==============================================================
mmoweaponary:
  pdc:
    activado: true
    namespace: mmoweaponary
    clave-tipo: tipo
    clave-clase: clase
    clave-nivel: nivel
    # stat de MMOClases: clave dentro del PDC del arma
    stats:
      vida_maxima: vida_maxima
      recurso_maximo: recurso_maximo
      regen_recurso: regen_recurso
      dano_fisico: dano_fisico
      dano_distancia: dano_distancia
      poder_magico: poder_magico
      poder_curacion: poder_curacion
      critico_prob: critico_prob
      critico_dano: critico_dano
      defensa: defensa
      robo_vida: robo_vida
      reduccion_enfriamiento: reduccion_enfriamiento
  vanilla:
    activado: true
    # MATERIAL: TIPO. "*_SWORD" vale para todas las espadas.
    tipos:
      BLAZE_ROD: BACULO
      STICK: VARITA
      BOW: ARCO
      CROSSBOW: BALLESTA
      "*_SWORD": ESPADA
      "*_AXE": HACHA
      MACE: MAZA
      GOLDEN_HOE: CETRO
      BOOK: TOMO

